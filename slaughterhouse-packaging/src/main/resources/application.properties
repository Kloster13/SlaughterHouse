spring.application.name=slaughterhouse-packaging

server.port=9093

# Fallback database for products that could not be sent while RabbitMQ is down
spring.datasource.url=jdbc:h2:file:./data/packaging-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Fail fast when RabbitMQ is unreachable (default is 60s)
spring.rabbitmq.connection-timeout=2s

# How often pending products are resent
packaging.retry-interval=30s
