syntax = "proto3";
option java_multiple_files = true;
package grpcslaughter;


message AnimalDTO {
  int64 id = 1;
  string farmName = 2;
  string type = 3;
  double weight = 4;
}

message ProductDto{
  string serial = 1;
  string packagedDate = 2;
  double weight = 3;
}

message TraceAnimalsFromProductRequest{
  int64 productId = 1;
}

message TraceAnimalsFromProductResponse{
  repeated AnimalDTO animals = 1;
}

message TraceProductsFromAnimalRequest{
  int64 animalId = 1;
}

message TraceProductsFromAnimalResponse{
  repeated ProductDto products = 1;
}

service InformationService{
  rpc traceAnimalsFromProduct(TraceAnimalsFromProductRequest) returns (TraceAnimalsFromProductResponse);
  rpc traceProductsFromAnimal(TraceProductsFromAnimalRequest) returns (TraceProductsFromAnimalResponse);
}