spring.application.name=slaughterhouse-parting

server.port=9092


# Fallback database for trays that could not be sent while RabbitMQ is down
spring.datasource.url=jdbc:h2:file:./data/parting-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Fail fast when RabbitMQ is unreachable (default is 60s)
spring.rabbitmq.connection-timeout=2s

# How often pending trays are resent
parting.retry-interval=30s
